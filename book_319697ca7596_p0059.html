    <div class="page-text">59 四聖諦

是件很難很難的,除非
聽聞到正法律的佛法
,如實知生命及世間形
成真相,才產生離欲
的意願。如果離欲而生
明,如同開燈打破黑
暗,無明就滅了,就漸
漸斷除貪欲、瞋恚、
愚癡,斷了意生身的封
滯,不會有追逐名色
的行為。生滅了,不再
生生死死,死死生生
。
這是苦滅聖諦的道理。因緣法就是解釋苦集滅道四聖諦的法,如
果於苦集滅道四聖諦有疑,要翻閱十二因緣法,才能清楚的看到四聖諦的內容。</div>
