            <p>209 四聖諦 
 
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁如是諸比丘，我成等正覺自所
見法，為人定說者，如手中樹
葉。所以者何？彼法義饒益，法饒益，梵行饒益，明慧正覺，向於涅槃。﹂ 
釋迦牟尼佛在摩竭國王舍城竹林聚落，和隨行眾在此聚落的申恕
林中，手把地上落葉說：諸位比丘，我成等正覺自覺知的法，常常為人說的，就如手中樹葉這一些些。為什麼？因為我說的這些法，法的義理饒益眾生，饒益修梵行，得
三明成正覺，向於涅槃。 
 </p>
