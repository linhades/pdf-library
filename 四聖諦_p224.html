            <p>四聖諦 224 
 
所以，各位比丘，沒有四聖諦的知見，不知不見生命及世間的真
實現象，不知眾生長久在地獄、畜生、餓鬼道受苦，此生生為人，可以聽聞正法，未見諦未無間等，當勤
方便，起增上欲，學無間等。 
錯過了此生生為人，沒有斷了下三惡道，就又長久在地獄、畜生
、餓鬼道受苦。
