    <div class="page-text">四聖諦 356

߇ߏĂ۰ܜĂٺαཐᏒϏมඈ۰Ă!
༊๔͞ܮĂᆧ˯୬ĂጯมඈĄ
!
Ңᄲѩགྷ̏ĂኜͧჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ϨྖᄬᛌĈ!
這是我聽說的:有一時期釋迦牟尼佛住在舍衛國祇樹給孤獨園。
當時須達長者來拜訪釋迦牟尼佛
,頂禮佛足後坐在一旁。
請問佛說:「世尊,這四聖諦是依次學習而得無間等,還是一學
就得無間等?」
釋迦牟尼佛告訴長者:「這四聖諦是漸次無間等,不是不學頓悟
無間等。」</div>
