            <p>261 四聖諦 
 
癡無癡、廣心狹心、小心大心、定心亂心、縛心解心、上心下心，至無上心皆悉知之，譬如有人以清水自照，好惡必察，比丘如是，以心淨故，能知他心。摩納，此是比丘第五勝法。
