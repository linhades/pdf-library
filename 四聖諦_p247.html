            <p>247 四聖諦 
 
捨。 無法不關心，不是沒有原因，這些覺不饒益義理，不饒益正法，
不饒益梵行，不得解脫智，
不得正覺，不向涅槃。 
如果要解脫這些煩惱，就要思惟苦聖諦，苦集聖諦，苦滅聖諦，
若要解脫生老病死憂悲惱苦，就要實踐苦滅道跡聖諦，要精進。
