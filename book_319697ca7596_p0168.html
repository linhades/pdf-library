    <div class="page-text">四聖諦 168

「如是如來應等正覺出於世間,
說苦聖諦現於世間,苦集聖諦
,苦滅聖諦,苦滅道跡聖諦現於世間。不復闇冥,長夜照明,純一智慧現於世間。」
釋迦牟尼佛說:如來應等正覺出於世間,說苦聖諦,苦集聖諦,
苦滅聖諦,苦滅道跡聖諦現於世間。世間不復闇冥,長夜照明,純一智慧現於世間。
但是釋迦牟尼佛及其阿羅漢弟子入滅後,此有故彼有,不見苦聖
諦,苦集聖諦,苦滅聖諦,苦滅道跡聖諦現於世間的眾生,還是在闇冥,長夜不見照明,純一黑暗的
世間(見雜阿含四二四經)。</div>
