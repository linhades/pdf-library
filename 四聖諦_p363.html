            <p>363 四聖諦 
 
，長者，於苦聖諦無間等已，而欲於苦集聖諦、苦滅聖諦、苦滅道跡聖諦無間等者，斯有是處。是故，長者，於四聖諦未無間等者，當勤方便，起增上欲，學無間等。﹂ 
譬如有人，取蓮華葉連合為盛水器，盛水行走，是可行的盛水方
法。解脫生老病死憂悲惱苦的方法，苦集滅道四聖諦是唯一的方法，是要次第學習，不是一頓無間等。 
釋迦牟尼佛為須達長者詳細說明苦集滅道四聖諦，須達長者見諦
得法眼淨，得無間等。於是歸依佛、法、僧，受持五戒。並要求建設精舍供養佛及僧眾。興
建了祗樹給孤獨園。
