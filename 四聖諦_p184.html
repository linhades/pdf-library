            <p>四聖諦 184 
 
ොྋĈ!
!

﹁如小綿丸、小劫貝華丸，置四
衢道頭，四方風吹，則隨風去
向於一方。﹂ 
﹁小綿丸﹂就是小綿花球。 
﹁小劫貝華丸﹂是不同品種的小綿花球。 
小綿花球放在十字路口，隨四方
吹來風向而移動，去向一方。 

﹁如是，若沙門婆羅門於苦聖諦
不如實知，於苦集聖諦，於苦
滅聖諦，苦滅道跡聖諦，不如實知。當知彼沙門婆羅門常觀他面，常隨他說，以不如實知故，聞彼所說，趣說而受，當知此人不宿修習智慧故。﹂
