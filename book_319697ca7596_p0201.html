Ңᄲѩགྷ̏ĂኜͧჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

「爾時世尊告諸比丘:於四聖諦平等正覺。」
釋迦牟尼佛對諸比丘說,於四聖諦平等正覺。就是說於四聖諦成
佛,與過去佛一樣,也與未來佛一樣,不分高下,三世諸佛都以四聖諦成佛,都號稱如來應等正覺。

名為如來、應、等正覺。
「如來」。
