    <div class="page-text">149 四聖諦

有苦集滅道四聖諦的知見,也都難逃六十二見網,就是沙門非沙門義,婆羅門非婆羅門義。

「是故,比丘,於四聖諦無
間等當起增上欲。」
四聖諦無間等,就是先要於苦聖諦,如實知生命及生存在世間的
真相,諸法法住法空,隨順緣起,無間等就是觀五陰無常、苦、空、非我,見諦得法眼淨。起增上欲,就是要有突破性的意願,勇猛精進,不畏任何阻礙。</div>
