    <div class="page-text"
         style="white-space: pre-wrap; overflow-wrap: anywhere;">四聖諦 286

ොྋĈ!
!

「諸比丘,若沙門婆羅門作如是
說:如沙門瞿曇所說苦聖諦,
我當捨,更立苦聖諦者,但有言數,問已不知,增其疑惑,以非其境界故。苦集聖諦、苦滅聖諦、苦滅道跡聖諦,我今當捨,更立餘四聖諦者,彼但有言數,問已不知,
增其疑惑,以非其境界故。」
釋迦牟尼佛說的這一段話,就是中國臨近區域流行佛法的現況,
用附佛外道法來取代四聖諦。問他四聖諦是什麼,只會說那是小乘法。完全不知這是三世唯一成佛之法。</div>
