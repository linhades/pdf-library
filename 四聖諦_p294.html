            <p>四聖諦 294 
 
善義善味，純一滿淨。附佛外道說釋迦牟尼佛三時、四時說了義不了義教，不就是疑佛說法不一嗎？疑佛不同時期說不同的法，不也就是疑法嗎？鄙視佛最初所說四聖諦，是不了義教，那些聲聞僧好傻好笨，不就是疑僧嗎？外道信口說的話就是四方風吹，十字路口的小綿花丸就隨風向而去。 
疑佛疑法疑僧，導致無法聽聞正法律。這種事實正是苦聖諦說，
諸法﹁法住法空﹂隨順眾生此有故彼有而緣起，學習外道法以為是學習佛法。 
 
 
 
 </p>
