            <p>四聖諦 346 
 
߇ߏĂͧ͸ĂٺαཐᏒϏ൑มඈ۰Ă!
༊๔͞ܮĂ੓ᆧ˯୬Ăጯ൑มඈĄ
!
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁譬如五節相續輪，大
力士夫令速旋轉。﹂ 
﹁五節相續輪﹂特技表演的工具。有五節連接成環狀的大輪，特
技表演的大力士，用各種高
難度的動作旋轉大輪。 

﹁如是，沙門婆羅門於此苦聖諦
不如實知，此苦集聖諦、苦滅
聖諦、苦滅道跡聖諦不如實知。輪迴五趣，而速旋轉，或墮地獄，或墮畜生，或墮餓鬼，或人、或天，還墮惡道，長夜輪轉。﹂ </p>
