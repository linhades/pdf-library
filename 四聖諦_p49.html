            <p>49 四聖諦 
 
，得五陰命根，形成六入處
。內六入處緣外六入
處，就呈現了生命及世間。
六入處緣觸，觸緣受
，就是生命生存在世間。為
了樂受失控了，所以
受緣愛，養成貪欲、瞋恚、
愚癡。愛緣取，取緣
有，有緣生，生緣老病死憂
悲惱苦。生命及世間
就是這樣聚集而成。 
  
苦集聖諦說明四取的行為取向，是聚集生老病死憂悲惱苦的原因
。眾生在無量再生再死的過程中，都不知不見此事實，可想而知，未來也如此。除非聽聞到正法律，而且見諦得無間等智慧，放棄四取的生活取向。但是正法律的佛法，不在
世間流行，誰能聽聞到此法？ 
 
 </p>
