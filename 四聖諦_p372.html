            <p>四聖諦 372 
 
，超大魚無法貫穿，超
小水蟲也無法貫穿。 

﹁佛告比丘：如是，如是。眾生
界無數無量。是故，比丘，於
四聖諦未無間等者，當勤方便，
起增上欲，學無間等。﹂ 
釋迦牟尼佛告訴比丘：就是這樣，眾生界的眾生種類很多，有大
有小，數量無法計算。此時世間有苦集滅道四聖諦，可使眾生解脫生老病死憂悲惱苦，但如大海中水族類，無論大小魚都無法聽聞四聖諦，如鏘木無法貫穿水蟲。現在求解脫的出家人，如果於四聖諦未無間等，錯失此生，可能如大海中的水蟲，無法聽聞四聖諦。所以當勤方便，起增上欲，學無間等。
