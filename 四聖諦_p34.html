            <p>四聖諦 34 
 

﹁爾時悉斷，悉知，斷其根本，
如截多羅樹頭，於未來世，成
不生法。是名多聞聖弟子於因緣法、緣生法如實正知，善見，善覺，善修，善入。﹂ 
﹁截多羅樹頭﹂多羅樹切斷頭部便不再生長。 
﹁於未來世，成不生法。﹂ 
見諦得無間等智，這是須陀洹果，此生若不得阿羅漢果，將於未
來世，最遲天上人間往返七次便得不生法，不受後有。在未成不生法期間都將在良好的世間學佛。 
﹁佛說此經已，諸比丘聞佛
所說，歡喜奉行。﹂ 
 
 
 
 </p>
