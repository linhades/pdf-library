
﹁爾時世尊告五比丘：此苦聖諦
，本所未曾聞法，當正思惟，
時生眼智明覺。﹂ 
所說明的﹁苦聖諦﹂，這是世間眾生從來沒有聽聞過的法，要用
心，用無貪欲心、無瞋心、無害心的正思惟，就會產生法眼淨，得解脫智、三明，成就等正覺。 
﹁眼﹂就是法眼淨。眾生對於生命及世間的形成不知不見，所以
