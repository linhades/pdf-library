            <p>3 四聖諦 
 
不知不見苦集滅道四聖諦就是自
我封閉墮入極其黑暗中。 
雜阿含二八七經釋迦牟尼佛自述成佛的經歷， 
說苦集滅道就是諸佛成佛之法。 
為什麼佛教徒不相信，還批評是聲聞法？ 
中阿含一三七經佛說： 
如來從成佛到最後於無
餘涅槃界將入滅時， 
於其中間若如來口有所言說，有所應對者，彼一切是真諦， 
不虛不離於如，亦非顛倒，真諦審實。 
中國佛教徒不知四聖諦是受附佛
外道三時五時判教所誤。 
就是十字路口的小綿花球，
外道風吹便吹向一邊。 
 
 二○一九年六月十日序於廣善精舍 釋從信 </p>
