貪欲心、瞋恚心、愚癡心，就是污垢，就是修梵行所要永盡無餘
的污垢，梵行已立就是離垢邊際。因此，比丘若欲自證，則能自證：我生已盡，梵行已立，所作
已作，自知不受後有。
