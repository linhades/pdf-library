            <p>四聖諦 24 
 
了，將死。這種現象就是無常，使人痛苦，但無法阻止。這種現象就是無常，苦，空，非我，就證明法住法空。列其論證如下： 
 知：法住無常， 
喻：無常故苦， 
喻：苦故非我，︵因為我無法拒
絕苦，此我就是非我。︶ 
喻：非我故空， 
處：法住法空。 
 ﹁法如，法爾，﹂ 
﹁法﹂就是現象。﹁如﹂就是隨順眾生的行為而顯現。為什麼法
住法空？就是因為法空才能隨順眾生的行為而顯現。譬如空白紙才能隨順我們任意寫字，稿紙寫文章就是隨順作者的寫作，就是﹁法如﹂</p>
