    <div class="page-text"
         style="white-space: pre-wrap; overflow-wrap: anywhere;">39 四聖諦

喻:愛緣取,
喻:取緣有,
喻:有緣生,
喻:生緣老病死憂悲惱苦,
處:六入處如是純大苦聚集。

分解六組三段論式說明如下:

一
知:六入處緣觸。 名色逐漸形成為六入處,具
有五陰、十八界、十
二入處功能,還未出生便已
能觸及外境色、聲、
香、味、觸、法。一旦出生
了,無論生在天、人
、畜生、餓鬼、地獄,各種
不同生活環境,都只
能知道所生活環境的色聲香
味觸法,而且觸及外</div>
