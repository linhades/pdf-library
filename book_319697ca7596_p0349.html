    <div class="page-text">349 四聖諦

Ңᄲѩགྷ̏ĂኜͧჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

「如來應等正覺增上說法,謂四
聖諦,開示、施設、建立、分
別、散說、顯現、表露。何等為四?謂苦聖諦、苦集聖諦、苦滅聖諦、苦滅道跡聖諦。」
「增上說法」。就是為了說法順利使聽聞人易知易解,設計如何
說法,如同現代老師教學設計。
說四聖諦,都以因緣法說明苦集滅道的內容,要舉各種例子,從
不同的方向,詳細說明,既要分析,又要歸納。就是開示、施設、建立、分別、散說、顯現、表
露。不是信口說佛法。</div>
