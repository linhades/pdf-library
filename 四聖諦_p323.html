            <p>323 四聖諦 
 
聖諦未無間等者，當勤方便，起增上欲，學無間等。﹂ 
活在有日月光明之下的眾生，尤其追求解脫生老病死憂悲惱苦的
沙門婆羅門，居然不知不見苦、集、滅、道四聖諦，修禪、修密、修淨土，後果就是墮於生老病死憂悲惱苦大闇冥中。所以，各位比丘，於四聖諦未無間等者，當勤方便
，起增上欲，學無間等。
