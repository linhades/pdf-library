            <p>四聖諦 50 
 
ࡴໝཐᏒ 
 
 
 

﹁云何苦滅道跡？緣眼、色，生
眼識，三事和合觸，觸滅則受
滅，受滅則愛滅，愛滅則取滅，取滅則有滅，有滅則生滅，生滅則老病死憂悲惱苦滅，如是純大苦聚滅。耳、鼻、舌、身、意，亦如是說，是名苦滅道跡。﹂ 
重新整理就是﹁六入處滅則觸滅，觸滅則受滅，受滅則愛滅，愛
滅則取滅，取滅則有滅，有滅則生滅，生滅則老病死憂悲惱苦滅，如是純大苦聚滅。﹂這是因緣法﹁此起故彼起，此滅故彼滅。﹂的經文。就是六組三段論式組成堆垛式論證，列其論證如下：  </p>
