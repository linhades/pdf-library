            <p>四聖諦 264 
 
ොྋĈ!
!

﹁波斯匿王、頻婆娑羅王，
何者大力，何者大富？﹂ 
﹁波斯匿王﹂是憍薩羅國國王。 
﹁頻婆娑羅王﹂是摩揭陀國國王。 
摩揭陀國與憍薩羅國並列為大強國。這二國王到底是誰大力大富
？這二位大國王都擁護佛法。比丘比丘尼都受其尊重供養，閒談也會論及二王誰強。 

﹁汝等比丘，莫作是論，所以者
何？此非義饒益，非法饒益，
非梵行饒益，非智、非
正覺，不向涅槃。﹂ 
釋迦牟尼佛未出家前是迦毗羅衛國的太子悉達多，將繼承王位，
但悉達多認為政治無法解脫人民的生老病死憂悲惱苦，不告而別出家</p>
