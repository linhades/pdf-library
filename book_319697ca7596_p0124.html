    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">四聖諦 124

於慢無間等,應斷句為:「於慢,無間等。」
雜阿含一○五經:「仙尼,我諸弟子於我所說能解義者,彼於諸
慢得無間等,得無間等故,諸慢則斷,諸慢斷故,身壞命終更不相續。」</div>
