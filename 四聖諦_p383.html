            <p>383 四聖諦 
 
੺҅̋ăච֍̋ăᩃ೩ᘲ࢘̋ăϿՒܟᘲ̋ă!
Ϥ⍺ܟᘲ̋ăืᑓ̋ͳĂ̈́̂г˿ϮĂϺೇтߏĄ!
т୨ڍĂтܠߏᇝઙڍ࢘ă෽ܟᘲڍă࢘ᘲڍ࢘ă!
ڍ֑Ă˜Ҍᄎ̄ᛊĂϺೇтߏĄ!
 
Ϩ
ྖᄬᛌĈ!
 這是我聽說的：有一時期釋迦牟尼佛住在舍衛國祇樹給孤獨園。 
當時世尊手捉團土，大如梨果。告訴比丘：﹁你們認為如何，我
手中團土多，還是大雪山中的土石多？﹂ 
比丘回答說：﹁世尊手中團土很少，大雪山王的土石很多，百千
億那由他，乃至算數譬類不得為比。﹂ </p>
