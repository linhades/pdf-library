<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 全文檢索圖書館</title>

    <link href="/pdf-library/pagefind/pagefind-ui.css" rel="stylesheet">

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
        }

        .admin-link {
            float: right;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .page-number {
            display: inline-block;
            margin: 6px 0;
            padding: 3px 9px;
            border-radius: 5px;
            background: #e8f1ff;
            color: #174ea6;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="/pdf-library/admin/" class="admin-link">
        ⚙️ 管理員登入後台
    </a>

    <h1>📚 PDF 智慧全文檢索圖書館</h1>
    <p>輸入關鍵字，搜尋所有書籍內文，並定位到對應 PDF 頁碼。</p>

    <div id="search"></div>

    <script src="/pdf-library/pagefind/pagefind-ui.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            new PagefindUI({
                element: "#search",
                showSubResults: true,
                showImages: false,
                excerptLength: 30,
                resetStyles: false
            });
        });
    </script>
</body>
</html>
