    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">四聖諦 164

辟支佛,證得無上正等正覺成佛。世間有聲聞乘、獨覺乘、佛乘,但所修的法就是苦集滅道四聖諦。三世諸佛所說的佛法就只有苦集滅道四聖諦。如實知此四聖諦就
是從修「無間等」入手。
