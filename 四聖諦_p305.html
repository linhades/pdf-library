            <p>305 四聖諦 
 
人，真的熱死自己。 

﹁是名比丘大熱燒然，甚可怖畏
，無有過者。是故，比丘，於
四聖諦未無間等者，當勤方便，
起增上欲，學無間等。﹂ 
偽裝修道有成，真的比大熱地獄還熱，甚可怖畏。所以，解除怖
畏，唯有於四聖諦見諦，得無間等。依照四聖諦的方法實踐八正道，才能解脫生老病死憂悲惱苦。還未得無間等，當勤方便，起增上欲，學無間等。 
 
 
! ! !</p>
