            <p>371 四聖諦 
 
༊๔͞ܮĂ੓ᆧ˯୬Ăጯ൑มඈĄ
!
Ңᄲߏགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁譬如大地草木，悉取為鏘，貫
大海中，一切水虫悉能貫不？
﹂ 
﹁鏘﹂音腔，堅硬的草木，敲打有鏘聲，選取這種堅硬的草木，
貫大海中的魚類，海水中的
水蟲都可被貫穿嗎？ 

﹁比丘白佛：不能，世尊。所以
者何？大海諸虫，種種形類，
或於細不可貫，或極大不可貫。﹂ 
比丘回答：不能，世尊。為什麼不能？因為大海中水族有大有小</p>
