「是故,比丘,於四聖諦未無間
等,當勤方便,起增上欲,學
無間等。!
「世間有邊無邊」、「是命是身、命異身異。」、「如來死後有
無」這些問題就是於四聖諦未無間等的困惑,應當用心於修無間等,不是論辯這些命題。</div>
