    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">四聖諦 344

不知不見苦集滅道四聖諦,就是學習外道法。有人心地善良,盲
目修道,也不害人害己,所以只是不得解脫生老病死苦,死後就可能再生於善處。如果盲目修道,如男女雙修,採補之術就是損人利己的方術,不墮三惡道也難。

「是故,諸比丘,於四聖諦未無
間等者,當勤方便,起增上欲
,學無間等。」
所以出家學道就要如實知苦集滅道四聖諦,外道說四聖諦不了義
是唬人,不要被騙了。趕快勤學四聖諦,見諦得無間等。還未無間等,當勤方便,起增上欲,學無間等。</div>
