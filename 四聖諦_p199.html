            <p>199 四聖諦 
 
的關鍵是無間等，所以要學無間等。 
無間等是從觀五陰無常、苦、空、非我，如實知諸法法住法空，
空相應隨順眾生此有故彼有，而有我的生命及生存世間，不是神造論不是自然生，於是見諦得法眼淨，得無間等。 
 
 
 
 
 
 
 
 </p>
