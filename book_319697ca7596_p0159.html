    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">159 四聖諦

тۢߏăтߏ֍ăтߏมඈĂϺтߏᄲĄ
!
Ңᄲѩགྷ̏ĂኜͧჷҢٙᄲĂᝌಈ؇ҖĄ!
!ොྋĈ!

「於四聖諦未無間等者,當
勤方便,修無間等。」
於四聖諦未無間等者,就是於四聖諦還未知未解,就是還未見諦
,當勤方便,修無間等。
知「無間等」就是知苦聖諦的先決條件。於苦聖諦見諦得「無間
等」,修無間等才後續知苦集聖諦、苦滅聖諦、苦滅道跡聖諦。
那麼未得無間等的人要如何修無間等呢?
雜阿含二五九經:</div>
