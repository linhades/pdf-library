            <p>四聖諦 296 
 
൒ೇѣ˘ໂஎⵍໂⵍٺѩĂࠤΞ۰ٍ̙ࠦĉ!
Ң׎ۢຍĂӈӘ֏ĈтߏĂͧ͸Ą!
ѩໂஎⵍĂ൒ೇѣ̂எⵍⵍٺѩ۰ĂࠤΞٍࠦĄ!
ᏜኜՒܝă૔ᘲࡴٺܝཐᏒ̙т၁ۢĂࡴะཐᏒă!
ࡴໝཐᏒăࡴໝ྽ྫཐᏒ̙т၁ۢĄ!
ٺكϠĂώኜҖሄ඾ĂٺҁঽѪᇎೌ೗ࡴϠĄ!
ώኜҖሄ඾Ă҃үߏҖĂҁঽѪᇎೌ೗ࡴҖĂ!
ᖼᆧ߇ܜĂᆪٺϠஎⵍ̝఍Ă!
ᆪٺҁঽѪᇎೌ೗ࡴஎⵍ̝఍Ą
!
тߏĂͧ͸Ăѩ݋̂எⵍⵍٺѩ۰Ą!
߇ߏĂͧ͸ĂٺαཐᏒϏ൑มඈ۰Ă!</p>
