            <p>283 四聖諦 
 

﹁如如，不離如、不異如，真實審諦不顛倒，是聖所諦。﹂ 
﹁如如﹂。 
如如就是如﹁如來﹂所說。 
﹁不離如﹂。 
我所知所見不離如來所說。 
﹁不異如﹂。 
我依法奉行，於苦聖諦當知當解﹁名色﹂，禪思觀五陰無常苦空
非我，證知五陰非我非我所，如實知諸法﹁法住法空﹂，隨順眾生的行為緣起生命及世間。於苦集聖諦當知當斷無明、有、愛。於苦滅聖諦當知當證眼解脫。於苦滅道跡聖諦當知當修，我實踐八正道不異如來所說。我真實審諦如來所說不顛倒，就是聖所說四聖諦。 
 
 </p>
