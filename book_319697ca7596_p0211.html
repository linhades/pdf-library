    <div class="page-text"
         style="white-space: pre-wrap; overflow-wrap: anywhere;">211 四聖諦

們說法(見雜阿含二八七經),也宣說苦集滅道四聖諦,九十六種外道就是沒有四聖諦無法解脫。外道聽聞佛法之後,擷取佛法增益其外道法,所宣揚的外道法也自稱是佛法,而且自稱是最殊勝的大乘法,浩瀚如海的是外道法。純正的佛法,如世尊說,如手中一些些樹葉這麼少,就是四聖諦成佛之法。</div>
