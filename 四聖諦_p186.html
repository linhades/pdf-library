            <p>四聖諦 186 
 
視他面，就是不視諸天，魔、梵、沙門婆羅門，及其他種種知識學問，師長、同事、同學、親友，不受他人的言論動搖，就是因為他前世已學有堅固的智慧，本
隨習故，不隨他語。 
同樣的道理，聲聞乘、辟支佛乘、佛乘，都是同修苦集滅道四聖
諦，成果不一，就是前世已
修習的智慧深度不一樣。 
此生如實知苦集滅道四聖諦，有人證須陀洹果、有人證斯陀含果
、有人證阿那含果、有人證阿羅漢果，就是前世學佛的歷程不一樣，不是證阿羅漢果的人比證須陀洹果的人犀利。是證阿羅漢果的人已歷經七有天人往生，於此世究竟苦邊。 
 
 
 
 </p>
