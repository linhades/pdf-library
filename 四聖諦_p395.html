﹁爾時世尊告諸比丘：我本未聞
法時，得正思惟此苦聖諦，正
見已生，此苦集聖諦、此苦滅聖諦、
苦滅道跡聖諦，正見已生。﹂ 
﹁我本未聞法時﹂就是釋迦牟尼佛自己還不知苦、集、滅、道四
聖諦時。自己心中都無此四聖諦概念，就是未聞自己心中所知的法。
﹁正見已生﹂是什麼正見已生？
就是﹁法住法空﹂正見。
