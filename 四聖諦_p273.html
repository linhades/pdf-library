            <p>273 四聖諦 
 
ӈྔࢴૅĂтߏᇃᄲĂ˜ҌϒШঠႄĄ
!
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁時有眾多比丘集於食堂，作如
是說論：某甲檀越作麤疏食，
我等食已，無味無力，我等不如捨彼麤食，而行乞食。所以者何？比丘乞食時得好食，又見好色，時聞好聲，多人所識，亦得衣被、臥具、醫藥。﹂ 
﹁麤疏食﹂ 
就是無魚無肉的素食。這位施主也許認為素食有益健康，所以供
養素食。因為出家人乞食無法挑食，無論是葷是素都得接受。釋迦牟</p>
