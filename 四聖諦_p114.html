            <p>四聖諦 114 
 
知：法住是無常， 
喻：無常是苦， 
處：法住是苦。 
 二 
知：法住是苦， 
喻：苦是非我， 
處：法住是非我。 
 三 
知：法住是非我， 
喻：非我是空， 
處：法住是法空。 </p>
