    <div class="page-text">四聖諦 216

毛為百分,而射一毛分,箭箭都中為難?
阿難回答:破一毛百分,射一分之毛,箭箭悉中為難。
佛告訴阿難:還不如於苦聖諦生如實知,這是更為難。如是,苦
集聖諦,苦滅聖諦,苦滅道跡聖諦,如實知見,此則甚難。
於是世尊說偈言:

一毛為百分 射一分甚難
觀一一苦陰 非我難亦然

佛說此經已,諸比丘聞
佛所說,歡喜奉行。

ොྋĈ!</div>
