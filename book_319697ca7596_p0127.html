    <div class="page-text">127 四聖諦

,正法律就消失了。
不過,苦集滅道四聖諦有傳到中國來,有翻譯成中文,但不流通
,因為大乘佛法主張常、樂、我、淨,追求常恒不滅法,如秦始皇追求長生不死仙丹,無法解讀正法律,以判教手段鄙視苦集滅道四聖諦。就這樣苦集滅道四聖諦被束之高閣。幸好在書局還可以買到大藏經,有興趣接受釋迦牟尼佛正法律之士,還是可以依教奉行。</div>
