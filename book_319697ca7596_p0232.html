    <div class="page-text">四聖諦 232

「當思惟四聖諦,何等為四?苦
聖諦、苦集聖諦、苦滅聖諦、
苦滅道跡聖諦。」
世間就只有四聖諦明白闡述生命及世間的真相,所以想要解脫緣
生,老病死憂悲惱苦的人生,唯有思惟四聖諦,才能如實知世間有天、人、地獄、畜生、餓鬼,現在雖生為人,其實長久以來都在地獄、畜生、餓鬼道受苦。錯失此生不思惟四聖諦,想再生為人,比盲龜浮木碰在一起還難。</div>
