    <div class="page-text">341 四聖諦

手扙拋向虛空,尋即掉下來,或根著地,或腹著地,或頭著地。就是墮地獄,或墮畜生,或墮餓鬼。

「是故,比丘,於四聖諦未無間
等者,當勤方便,學無間等。
」
佛教在中國有二千多年,有無量的比丘、比丘尼、沙彌、沙彌尼
,接受外道判教之說,都鄙視苦集滅道四聖諦,也有大量的在家知識份子,一旦學佛也都鄙視苦集滅道四聖諦,所以都不知不見四聖諦,都只學附佛外道法。
中國佛教徒不論在家出家,如果自以為是沙門婆羅門,於四聖諦
未無間等者,當勤方便,學無間等。</div>
