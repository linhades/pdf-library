    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">四聖諦 194

想得美,以為死後就沒煩惱了。大部份眾生死後來不及後悔,又再生地獄、畜生、餓鬼道中。此生生為人類,以苦為樂,有機會見識苦集滅道四聖諦,不要錯過了短暫人生,當忍苦、樂、憂、悲,於四聖諦勤加精進,方便修習無間等。如雜阿含三九六經說,見諦得法眼淨、無間等,便斷了下墮三惡道。即使放逸,七有天上、人間往返,究竟苦邊。</div>
