            <p>四聖諦 392 
 
ϨྖᄬᛌĈ!
!
這是我聽說的：有一時期佛住在舍衛國祇樹給孤獨園。 
當時釋迦牟尼佛用手指的指甲擎土，告訴在座的比丘：﹁你們認
為如何，我指甲上的土多，還是大地土多？﹂ 
比丘回答佛說：﹁世尊指甲上的土甚少，大地土很多無法用算數
譬類，不能比。﹂ 
佛告訴比丘：﹁我手指甲上的土，就像有形狀可見的眾生，但形
狀微細看不見的眾生，如大地土。所以，比丘，於四聖諦未無間等者，當勤方便，學無間等。﹂ 
佛說是經已，諸比丘聞
佛所說，歡喜奉行。 
 </p>
