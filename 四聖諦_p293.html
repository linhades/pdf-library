            <p>293 四聖諦 
 
ڱٺăဃ൑ႷĄ!
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁若於集﹂大正藏誤植為﹁若苦集﹂。 

﹁若沙門婆羅門於苦聖諦有疑者
，則於佛有疑，於法、僧有疑
。若苦、集、滅、道疑者，則於佛有疑，於法、僧有疑。﹂ 
流行佛法公然鄙視苦集滅道四聖諦，就是於苦集滅道四聖諦有疑
，也就是於佛、法、僧有疑，但是佛教徒都不知自己於佛法僧有疑。這說明佛教徒從來沒有聽聞過正法律， 
釋迦牟尼佛說法，常先聲明初、中、後善，表明所說佛法都一樣</p>
