            <p>51 四聖諦 
 
知：六入處滅則觸滅， 
喻：觸滅則受滅， 
喻：受滅則愛滅， 
喻：愛滅則取滅， 
喻：取滅則有滅， 
喻：有滅則生滅， 
喻：生滅則老病死憂悲惱苦滅， 
處：六入處滅如是純大苦聚滅。 
 
 
因緣法﹁此滅故彼滅﹂，是逆行因緣法。從為什麼眾生非老死不
可，追問而逆行，是有生故有老死，若生滅則老死滅。一路追問到無明滅故行滅。然後再從頭重
新整理的堆垛式論證。 
分解六組三段論式如下： </p>
