            <p>135 四聖諦 
 
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁諸比丘，云何無有關鍵？謂五
下分結已離，已知。是名離關
鍵。﹂ 
五下分結，謂身見、戒取、疑、貪欲、瞋恚。斷此五下分結，就
證得阿那含果，還未成就阿羅漢果，還有關鍵卡住。若增上慧學滿足，已離已知，解脫阿那含的
關鍵，就是離關鍵。 

﹁云何平治城塹？無明謂之深塹
。彼得斷知，是名平治城塹。
﹂ 
阿那含的關鍵就是少慧，就是無明深塹未斷，若無明永斷無餘，</p>
