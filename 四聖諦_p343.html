            <p>343 四聖諦 
 
༊๔͞ܮĂ੓ᆧ˯୬Ăጯ൑มඈĄ
!
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁如人擲杖置虛空中，其必還墮
，或墮淨地，或墮不淨地。如
是，沙門婆羅門於苦聖諦不如實知，於苦集聖諦、苦滅聖諦、苦滅道跡聖諦不如實知。以不如實知故，或生善趣，或生惡趣。﹂ 
如果有人把手杖拋向天空，一定掉下來，也許掉在乾淨的地方，
也許掉在骯髒的地方。追求解脫道的沙門婆羅門，如果不如實知世界上唯一可以解脫生老病死憂悲惱苦的方法，盲修瞎煉，死後可能再生善處、可能再生惡處。 </p>
