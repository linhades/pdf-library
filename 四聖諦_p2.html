            <p>四聖諦 2 
 
Ԕ!
 
 
苦集滅道四聖諦是唯一成佛之法， 
過去諸佛都是以苦集滅道四聖諦而成佛， 
未來的佛也是以四聖諦而成佛。 
學佛就是學苦集滅道四聖諦， 
但是佛教徒說苦集滅道四聖
諦是聲聞法，不學。 
雜阿含四二六經說：三千大
千世界可見大闇冥世界， 
大闇冥世界的眾生連自己長
成什麼模樣都不知不見。 
學佛不知苦集滅道四聖諦的人， 
佛說其黑暗遠比大闇冥
世界的眾生還黑暗。 
現代人還可閱讀到聖典如實
知苦集滅道成佛之法， </p>
