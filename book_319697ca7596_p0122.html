「慢」。
慢就是憍慢。慢,就是有我才有憍慢,所以有我勝、我等、我劣
,我知、我見,以自我為中心生活在世間,際遇也都不同於他人。同樣接受教育都各取所需,聽聞佛法,於「無間等」,也是我慢所知的無間等,就是慢無間等。不是正解「無間等」,就無法如實知苦集滅道四聖諦,無法究竟苦邊。</div>
