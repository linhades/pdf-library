            <p>四聖諦 308 
 
還裝模做樣修道有成就，就是比生在大闇地獄的眾生還要黑暗，墮入生老病死憂悲惱苦中。 


活在人間未死，於四聖諦未無
間等者，當勤方便，起增上欲，學無間等，便可解除極大黑暗之苦。
