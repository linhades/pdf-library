            <p>141 四聖諦 
 
雜阿含三七九經：﹁於四聖諦已知已解出、已知已斷出、已知已
證出、已知已修出。﹂就是捨除諸諦，已結束了苦集滅道修證，遠離﹁不知應走向何方﹂的十字路口，已得無學戒身成就，無學定身成就、無學慧身成就、無學解脫身成就、無學解脫知見身成就，自身所作，心善解脫，慧善解脫，純
一清白，名為上士。
