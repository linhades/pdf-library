            <p>379 四聖諦 
 
ϨྖᄬᛌĈ!
!
 這是我聽說的，有一時期釋迦牟
尼佛住在王舍城迦蘭陀竹園。 
當時釋迦牟尼佛告訴諸比丘：﹁譬如大湖，深廣五十由旬。面積
廣大湖水很深，是在湖水水滿的狀態，有人用毛髮，或用手指指端渧湖水，渧了兩三次。比丘，你們認為怎樣，渧水人所渧的水多，還是湖水的水多？﹂ 
比丘回答：﹁渧水人再三渧水，只兩三渧水，而湖水的數量，無
法用算數譬類來比較。﹂ 
佛告訴比丘：﹁如大湖水，數量很多。像這樣有很多聽聞四聖諦
的弟子見諦得法眼淨，成須陀洹果，斷三惡道的苦本，如截多羅樹頭</p>
