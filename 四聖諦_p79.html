            <p>79 四聖諦 
 
欲行為就是四如意足的欲定如意足，然後能精進、一心、思惟。便能離欲生明。 
﹁正語﹂。 
雜阿含七八四經：離妄語、離兩舌、離惡口、離綺語。 
﹁離妄語﹂。自己知道所說的言語不真實，就是妄語。妄語是惡
行，有惡行報。所以要離妄語。 
﹁離兩舌﹂。兩舌就是搬弄是非
，這是惡行，所以要離兩舌。 
﹁離惡口﹂。惡口就是罵人粗話，是惡行，所以要離惡口。 
﹁離綺語﹂。綺語就是言過其實引人入勝的言論。這是惡行，所
以要離綺語。 
妄語說自己學佛已成佛、已成阿羅漢、已見諦、已得禪定，是不
可悔罪，餘為可悔罪。 
﹁正業﹂。 </p>
