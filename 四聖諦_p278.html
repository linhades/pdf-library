            <p>四聖諦 278 
 
тߏĂ͵಴ᄲαཐᏒĂԧӈ޺צĄ
!
ҢӘͧ͸ĈචݙĂචݙĂԧᄲࡴཐᏒĂ!
Ѭৌ၁޺צĄԧᄲࡴะཐᏒăࡴໝཐᏒă!
ࡴໝ྽ྫཐᏒĂѬৌ၁޺צĄ!
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
 
ොྋĈ!
 
﹁時有異比丘從座起，正衣服，
為佛作禮，合掌白佛：唯然，
世尊所說四聖諦，我悉受持。佛告比丘：汝云何受持四聖諦。﹂ 
釋迦牟尼佛為諸比丘說苦集滅道四聖諦，說完了，有位比丘從座
位起立，整理衣服後，禮佛合掌說：﹁世尊所說四聖諦我都牢牢記住</p>
