    <div class="page-text" style="white-space: pre-wrap; overflow-wrap: anywhere;">113 四聖諦

色受想行識就是法住現象,觀色受想行識五陰無常、苦,悟入空
、非我,就是觀法住無常、苦,悟入空、非我。法住法空列其論式如下:
知:法住是無常,
喻:無常是苦,
喻:苦是非我,
喻:非我是空,
處:法住法空。
這是三組三段論式堆垛而成的論證,分解為三組三段論式,會看
得更清楚。
一</div>
