    <div class="page-text">四聖諦 276

驅動身體生起性愛需求。飲食便是觀察梵行是否解脫的項目,雜阿含三七三經,佛告比丘:摶食斷知已,於五欲功德貪愛則斷,五欲功德貪愛斷者,我不見彼多聞聖弟子於五欲功德上有一結使而不斷者。有一結繫故,則還生此世。
所以在飲食方面要少欲知足。少欲知足就是離欲的行為,就是斷
無明的行為。</div>
