name: Build and Deploy PDF Library

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 從 Supabase 下載 PDF 與書名對照資料
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          secret_key = os.environ["SUPABASE_SECRET_KEY"]
          bucket = "library-pdfs"
          pdf_dir = Path("pdfs")
          pdf_dir.mkdir(parents=True, exist_ok=True)

          headers = {
              "apikey": secret_key,
              "Authorization": f"Bearer {secret_key}",
              "Content-Type": "application/json",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def download_object(storage_name, destination):
              encoded_name = urllib.parse.quote(storage_name, safe="")
              url = (
                  f"{base_url}/storage/v1/object/"
                  f"{bucket}/{encoded_name}"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "apikey": secret_key,
                      "Authorization": f"Bearer {secret_key}",
                  },
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  destination.write_bytes(response.read())

          # 先取得 manifest；不存在時使用舊檔名模式。
          manifest_path = Path("library-manifest.json")
          manifest_url = (
              f"{base_url}/storage/v1/object/"
              f"{bucket}/library-manifest.json"
          )

          manifest = {"version": 1, "files": []}

          try:
              req = urllib.request.Request(
                  manifest_url,
                  headers={
                      "apikey": secret_key,
                      "Authorization": f"Bearer {secret_key}",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  manifest = json.loads(
                      response.read().decode("utf-8")
                  )
              manifest_path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("已下載書名對照資料。")
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", errors="replace")
              print(f"Manifest HTTP 狀態：{exc.code}")
              print(f"Manifest 錯誤內容：{error_body}")

              try:
                  error_data = json.loads(error_body)
              except json.JSONDecodeError:
                  error_data = {}

              error_text = (
                  str(error_data.get("message", ""))
                  + " "
                  + str(error_data.get("error", ""))
              ).lower()

              is_missing_manifest = (
                  exc.code == 404
                  or str(error_data.get("statusCode", "")) == "404"
                  or "object not found" in error_text
              )

              if not is_missing_manifest:
                  raise

              if manifest_path.exists():
                  manifest_path.unlink()

              print("尚無 manifest，使用舊式檔名模式。")


          # manifest 中的新式檔案：以原始檔名存入本機 pdfs/。
          manifest_files = manifest.get("files", [])
          mapped_storage_names = set()

          for item in manifest_files:
              if not isinstance(item, dict):
                  continue

              storage_name = item.get("storageName")
              original_name = item.get("originalName")

              if not isinstance(storage_name, str):
                  continue
              if not isinstance(original_name, str):
                  continue
              if not original_name.lower().endswith(".pdf"):
                  continue
              if (
                  "/" in original_name
                  or "\\" in original_name
                  or original_name in (".", "..")
              ):
                  raise RuntimeError(
                      f"manifest 含有不安全的檔名：{original_name}"
                  )

              download_object(storage_name, pdf_dir / original_name)
              mapped_storage_names.add(storage_name)
              print(f"已下載 PDF：{original_name}")

          # 舊式檔案：manifest 未管理的根目錄 PDF 仍以原檔名下載。
          offset = 0
          limit = 100
          downloaded_legacy = 0

          while True:
              items = post_json(
                  f"{base_url}/storage/v1/object/list/{bucket}",
                  {
                      "prefix": "",
                      "limit": limit,
                      "offset": offset,
                      "sortBy": {
                          "column": "name",
                          "order": "asc",
                      },
                  },
              )

              if not items:
                  break

              for item in items:
                  name = item.get("name", "")

                  if (
                      not name
                      or "/" in name
                      or not name.lower().endswith(".pdf")
                      or name in mapped_storage_names
                  ):
                      continue

                  destination = pdf_dir / name
                  download_object(name, destination)
                  downloaded_legacy += 1
                  print(f"已下載舊式 PDF：{name}")

              if len(items) < limit:
                  break

              offset += len(items)

          pdf_files = list(pdf_dir.glob("*.pdf"))
          if not pdf_files:
              raise RuntimeError(
                  "Supabase Storage 中沒有找到 PDF，停止建置。"
              )

          print(f"PDF 下載完成，共 {len(pdf_files)} 個本機檔案。")
          PY

      - name: 安裝 PDF 文字抽取套件
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: 產生逐頁 HTML
        env:
          # 可在 Repository Variables 設定 PDF_BASE_URL。
          # 留空時，build.py 會把 PDF 複製到 pages/pdfs。
          PDF_BASE_URL: ${{ vars.PDF_BASE_URL }}
        run: python build.py

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 建立 Pagefind 搜尋索引
        run: npx --yes pagefind@1.5.2 --source "pages"

      - name: 檢查搜尋索引是否建立
        run: |
          test -f pages/pagefind/pagefind.js
          test -f pages/pagefind/pagefind-ui.js
          test -f pages/index.html
          echo "Pagefind 索引檔案已建立"

      - name: 複製管理員後台
        run: |
          mkdir -p pages/admin
          cp -R admin/. pages/admin/

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
          clean: true
