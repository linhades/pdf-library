name: Build and Deploy PDF Library

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 從 Supabase 下載 PDF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          secret_key = os.environ["SUPABASE_SECRET_KEY"]
          bucket = "library-pdfs"
          pdf_dir = Path("pdfs")
          pdf_dir.mkdir(parents=True, exist_ok=True)

          headers = {
              "apikey": secret_key,
              "Authorization": f"Bearer {secret_key}",
              "Content-Type": "application/json",
          }

          def request_json(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          downloaded = 0
          offset = 0
          limit = 100

          while True:
              items = request_json(
                  f"{base_url}/storage/v1/object/list/{bucket}",
                  {
                      "prefix": "",
                      "limit": limit,
                      "offset": offset,
                      "sortBy": {"column": "name", "order": "asc"},
                  },
              )

              if not items:
                  break

              for item in items:
                  name = item.get("name", "")

                  # 只下載根目錄中的 PDF，不處理子資料夾。
                  if not name or "/" in name or not name.lower().endswith(".pdf"):
                      continue

                  encoded_name = urllib.parse.quote(name, safe="")
                  url = (
                      f"{base_url}/storage/v1/object/"
                      f"{bucket}/{encoded_name}"
                  )

                  req = urllib.request.Request(url, headers={
                      "apikey": secret_key,
                      "Authorization": f"Bearer {secret_key}",
                  })

                  destination = pdf_dir / name
                  with urllib.request.urlopen(req, timeout=120) as response:
                      destination.write_bytes(response.read())

                  downloaded += 1
                  print(f"已下載 PDF：{name}")

              if len(items) < limit:
                  break

              offset += len(items)

          if downloaded == 0:
              raise RuntimeError(
                  "Supabase Storage 中沒有找到根目錄 PDF，停止建置。"
              )

          print(f"PDF 下載完成，共 {downloaded} 個檔案。")
          PY

      - name: 安裝 PDF 文字抽取套件
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: 產生逐頁 HTML
        env:
          # 可在 Repository Variables 設定 PDF_BASE_URL。
          # 留空時，build.py 會把 PDF 複製到 pages/pdfs。
          PDF_BASE_URL: ${{ vars.PDF_BASE_URL }}
        run: python build.py

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 建立 Pagefind 搜尋索引
        run: npx --yes pagefind@1.5.2 --source "pages"

      - name: 檢查搜尋索引是否建立
        run: |
          test -f pages/pagefind/pagefind.js
          test -f pages/pagefind/pagefind-ui.js
          test -f pages/index.html
          echo "Pagefind 索引檔案已建立"

      - name: 複製管理員後台
        run: |
          mkdir -p pages/admin
          cp -R admin/. pages/admin/

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
          clean: true
