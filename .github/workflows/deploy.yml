name: Build and Deploy PDF Library

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 PDF 文字抽取套件
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: 產生逐頁 HTML
        env:
          # 可在 Repository Variables 設定 PDF_BASE_URL。
          # 留空時，build.py 會把 PDF 複製到 pages/pdfs。
          PDF_BASE_URL: ${{ vars.PDF_BASE_URL }}
        run: python build.py

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 建立 Pagefind 搜尋索引
        run: npx --yes pagefind@1.5.2 --source "pages"

      - name: 檢查搜尋索引是否建立
        run: |
          test -f pages/pagefind/pagefind.js
          test -f pages/pagefind/pagefind-ui.js
          test -f pages/index.html
          echo "Pagefind 索引檔案已建立"

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
          clean: true
