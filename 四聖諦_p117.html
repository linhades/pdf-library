            <p>117 四聖諦 
 
Ңᄲѩགྷ̏Ăኜͧ͸ჷҢٙᄲĂᝌಈ؇ҖĄ!
! !ොྋĈ!

﹁若比丘於苦聖諦當知，當解。﹂ 
苦聖諦的內容見雜阿含二九六經，因緣法所緣生的諸法：無明、
行、識、名色、六入處、觸、受、愛、取、有、生、老病死。詳細說明在雜阿含二九八經。生老病死憂悲惱苦的人生，就是緣無明行，緣行識，緣識﹁名色﹂，乃至緣生老病死。﹁名色﹂就是於苦聖諦所應當知，不只要知，還應當澈底了解。 
流行佛法為什麼有第七識、第八識、如來藏識，有靈魂見，就是
不了解﹁名色﹂。以為父母交配受孕產生具有五陰的名色，來入胎的</p>
