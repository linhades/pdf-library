            <p>301 四聖諦 
 
十七經︶。盲目的行為就是加深加重墮入生老病死憂悲惱苦的深嶮處。 
其次持佛心咒，三世諸佛不會有心咒，釋迦牟尼佛更說凡持咒就
不可能見諦、得法眼淨、得無間等。持咒坐禪使自己遠雜佛法，只加重生老病死憂悲惱苦。這種行為
就是比在大深嶮還深嶮。
