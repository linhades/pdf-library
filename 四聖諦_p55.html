            <p>55 四聖諦 
 
思惟禪定，沒有禪定愛。 
 
三 
知：六入處滅則愛滅。 六入處無明滅，不染著欲愛、色愛、無色愛。還未成不生之時，於
眼耳鼻舌身意接觸色
聲香味觸法時，彼彼生
起染著時彼彼斷捨離
，則愛滅。 
喻：愛滅則取滅。     
如果聽聞正法律，離於
欲愛、色愛、無色愛
。不再以欲取、見取、
戒取、我語取，四取
為生存準則，遠離種種
煩惱。學佛的眾生，
離欲則生明，離少許欲
，便能見諦得法眼淨
，斷身見、戒取、疑，
得須陀洹果。以戒為
師，就是以戒收拾身心
，累世養成的四取取
向的行為便能滅除。 </p>
